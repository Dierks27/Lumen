name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v0.1.0. Created at the selected ref if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checks out the tag for a tag push, or the selected branch for a manual run.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Locate the mod jar
        id: jar
        run: |
          set -euo pipefail
          # build/libs holds the remapped mod jar and the sources jar; we ship the former.
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one mod jar in build/libs, found ${#jars[@]}:" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${jars[0]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its assets."
            gh release upload "$TAG" "$JAR" --clobber
          else
            # --target creates the tag at this commit when it does not exist yet,
            # which is how a release gets cut without pushing a tag by hand.
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "Lumen $TAG" \
              --notes-file .github/release-body.md
          fi
